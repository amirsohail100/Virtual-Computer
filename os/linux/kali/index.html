<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kali Linux — Virtual Computer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="screen" class="ac-blue">

  <!-- Boot + login (LightDM style) -->
  <div id="boot"><pre id="bootlog"></pre></div>
  <div id="login" class="hidden">
    <div class="ltop"><span id="lgClock"></span><button id="lgPower" title="Shut down / Switch OS">⏻</button></div>
    <div class="lbox"><div class="lav">🐉</div><div class="lname">kali</div>
      <input id="pw" type="password" placeholder="Password" autocomplete="off"><button id="lgGo">Log In</button>
      <small id="lgMsg">Default password: kali</small></div>
  </div>

  <!-- Desktop -->
  <div id="desktop"><div id="icons"></div></div>
  <div id="windows"></div>

  <!-- Xfce top panel -->
  <div id="panel">
    <button id="kbtn" title="Applications Menu">🐉</button>
    <div class="lau"><button data-l="terminal" title="Terminal Emulator">⌨</button><button data-l="files" title="File Manager">📁</button><button data-l="browser" title="Web Browser">🦊</button><button data-l="editor" title="Mousepad">📝</button></div>
    <div id="tasks"></div>
    <div id="ws"></div>
    <div id="tray"><span id="trNet" title="Wired connection">🖧</span><span id="trVol" title="Volume">🔊</span><span id="trBat" title="Battery"></span><span id="trClock"></span><button id="trPower" title="Session">⏻</button></div>
  </div>

  <!-- Applications menu -->
  <div id="kmenu" class="hidden">
    <div class="kh0"><span class="av">🐉</span><b>kali</b><span class="sp"></span><button data-k="settings" title="Settings">⚙</button><button data-k="lock" title="Lock Screen">🔒</button><button data-k="logout" title="Log Out">⏻</button></div>
    <input id="ksearch" placeholder="Search applications…" autocomplete="off">
    <div class="kb"><div class="kc" id="kcats"></div><div class="ka" id="kapps"></div></div>
  </div>

  <div id="popup" class="hidden"></div>
  <div id="notify"></div>
  <div id="ctx" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="dim"></div>
  <div id="off" class="hidden"><p id="offMsg"></p><button id="powerOn">⏻ Power on</button></div>
</div>
<script src="js/apps.js"></script>
<script src="js/main.js"></script>
</body>
</html>
