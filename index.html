<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows 11 Web (Educational Prototype)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="screen">
  <!-- Lock screen -->
  <div id="lock">
    <div class="lock-time" id="lockTime"></div>
    <div class="lock-date" id="lockDate"></div>
    <div class="lock-hint">Click or press any key to unlock</div>
  </div>

  <!-- Desktop -->
  <div id="desktop"><div id="icons"></div></div>
  <div id="windows"></div>

  <!-- Start menu -->
  <div id="start" class="flyout hidden">
    <div class="st-search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="startSearch" type="text" placeholder="Search for apps, settings, and documents" autocomplete="off"></div>
    <div id="stMain">
      <div class="st-row"><b>Pinned</b><button class="st-btn" id="allAppsBtn">All apps <span>›</span></button></div>
      <div id="pinnedGrid" class="grid"></div>
      <div class="st-row"><b>Recommended</b><button class="st-btn" id="moreRec">More <span>›</span></button></div>
      <div id="recList" class="rec"></div>
    </div>
    <div id="stAll" class="hidden"></div>
    <div id="stFind" class="hidden"></div>
    <div class="start-foot">
      <div class="user"><span class="avatar">👤</span> Student</div>
      <button id="powerBtn" class="pbtn" title="Power">⏻</button>
      <div id="powerMenu" class="hidden"><div data-p="lock">🔒 Lock</div><div data-p="restart">🔄 Restart</div><div data-p="shutdown">⏻ Shut down</div></div>
    </div>
  </div>

  <!-- Quick settings (Wi-Fi / volume button) -->
  <div id="quick" class="flyout hidden"></div>

  <!-- Hidden icons (^ button) -->
  <div id="overflow" class="flyout hidden"></div>

  <!-- Keyboard layout (ENG IN button) -->
  <div id="lang" class="flyout hidden"></div>

  <!-- Notifications + Calendar (date/time button) -->
  <div id="notifCenter" class="hidden">
    <div id="notifPanel" class="panel"></div>
    <div id="calPanel" class="panel"></div>
  </div>

  <div id="toasts"></div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div class="tb-center">
      <button id="startBtn" class="tb-btn" title="Start">
        <svg viewBox="0 0 24 24" width="22" height="22"><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63d2ff"/><stop offset="1" stop-color="#0a78f0"/></linearGradient></defs>
          <rect x="2.5" y="2.5" width="9" height="9" rx="1.3" fill="url(#wg)"/><rect x="12.5" y="2.5" width="9" height="9" rx="1.3" fill="url(#wg)"/>
          <rect x="2.5" y="12.5" width="9" height="9" rx="1.3" fill="url(#wg)"/><rect x="12.5" y="12.5" width="9" height="9" rx="1.3" fill="url(#wg)"/></svg>
      </button>
      <div id="taskApps"></div>
    </div>
    <div class="tb-right">
      <button id="trayOverflow" class="tray" title="Show hidden icons"><i data-ico="chevU"></i></button>
      <button id="trayLang" class="tray lang" title="Keyboard layout"><span>ENG</span><span>IN</span></button>
      <button id="trayQuick" class="tray" title="Wi-Fi, volume"><i id="icoWifi" data-ico="wifi"></i><i id="icoVol" data-ico="vol"></i></button>
      <button id="trayClock" class="tray clock" title="Notifications &amp; calendar"><span class="ct"><span id="tbTime"></span><span id="tbDate"></span></span><span id="badge" class="badge"></span></button>
    </div>
  </div>

  <div id="ctx" class="hidden"></div>
  <div id="dim"></div>
  <div id="night"></div>
  <div id="off" class="hidden"><button id="powerOn">⏻ Power on</button></div>
</div>

<script src="js/apps.js"></script>
<script src="js/explorer.js"></script>
<script src="js/apps-extra.js"></script>
<script src="js/main.js"></script>
</body>
</html>
